name: CI - Develop

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_build-and-test.yml
    with:
      solution_file: Maliev.IAMService.slnx
      extra_args: -p:ServiceDefaultsVersion=1.0.86-alpha -p:MessagingContractsVersion=1.0.94-alpha
    secrets:
      gitops_pat: ${{ secrets.GITOPS_PAT }}

  build-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3
        with:
          project_id: maliev-website

      - name: Build and push Docker image
        shell: bash
        env:
          NUGET_USERNAME: ${{ github.actor }}
          NUGET_PASSWORD: ${{ secrets.GITOPS_PAT }}
          IMAGE_TAG: asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-dev/maliev-iam-service:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
          docker build \
            --secret id=nuget_username,env=NUGET_USERNAME \
            --secret id=nuget_password,env=NUGET_PASSWORD \
            --build-arg SERVICE_DEFAULTS_VERSION=1.0.86-alpha \
            --build-arg MESSAGING_CONTRACTS_VERSION=1.0.94-alpha \
            --tag "$IMAGE_TAG" \
            --file Maliev.IAMService.Api/Dockerfile .
          docker push "$IMAGE_TAG"

      - name: Checkout maliev-gitops repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: MALIEV-Co-Ltd/maliev-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: maliev-gitops

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f  # v2

      - name: Update image tag in maliev-gitops using Kustomize
        run: |
          cd maliev-gitops/3-apps/maliev-iam-service/overlays/development
          source_image="asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact/maliev-iam-service"
          target_image="asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-dev/maliev-iam-service:${{ github.sha }}"
          kustomize edit set image "$source_image=$target_image"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
          PR_BODY: |
            Automated GitOps Update

            - **Service**: IAMService
            - **Environment**: Development
            - **Image Tag**: ${{ github.sha }}
            - **Source Branch**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}

            Updates the disabled IAMService development overlay only. Deployment remains a separately reviewed GitOps decision.

            Triggered by: ${{ github.actor }}
            Workflow: ${{ github.workflow }}
            Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        run: |
          cd maliev-gitops
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          BRANCH_NAME="iam-service/dev-${{ github.sha }}"
          git switch -c "$BRANCH_NAME"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(dev): Update IAMService image to ${{ github.sha }}"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --title "chore(dev): Update iam-service" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME" \
            --repo MALIEV-Co-Ltd/maliev-gitops
