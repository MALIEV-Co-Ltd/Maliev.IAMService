name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - staging
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iam_service_test_db
          PGDATA: /var/lib/postgresql/data/pgdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Switch to PackageReference for CI
        run: |
          # Replace ProjectReference with PackageReference in all service csproj files
          echo "Converting ProjectReferences to PackageReferences..."

          for file in $(find . -name "*.csproj"); do
            echo "Processing $file"

            # Backup
            cp "$file" "$file.bak"

            # Replace Aspire ServiceDefaults
            sed -i 's|<ProjectReference Include=".*Maliev.Aspire.ServiceDefaults.*.csproj" />|<PackageReference Include="Maliev.Aspire.ServiceDefaults" Version="1.0.*" />|g' "$file"

            # Replace MessagingContracts (if present)
            sed -i 's|<ProjectReference Include=".*Maliev.MessagingContracts.*.csproj" />|<PackageReference Include="Maliev.MessagingContracts" Version="1.0.*" />|g' "$file"

            # Verify changes
            if grep -q "ProjectReference.*Maliev.Aspire.ServiceDefaults" "$file"; then
              echo "ERROR: Failed to replace Aspire.ServiceDefaults in $file"
              exit 1
            fi

            # Show diff
            diff "$file.bak" "$file" || true
          done

          echo "Switched to PackageReference for ServiceDefaults and MessagingContracts"

      - name: Restore dependencies
        run: dotnet restore Maliev.IAMService.sln
        env:
          NUGET_USERNAME: ${{ github.actor }}
          NUGET_PASSWORD: ${{ secrets.GITOPS_PAT }}

      - name: Build solution
        run: dotnet build Maliev.IAMService.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Maliev.IAMService.sln --no-build --configuration Release --verbosity normal
        env:
          ConnectionStrings__IAMDbContext: "Server=localhost;Port=5432;Database=iam_service_test_db;User Id=postgres;Password=postgres;"


